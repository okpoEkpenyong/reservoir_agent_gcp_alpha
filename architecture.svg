<svg width="100%" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Exzing Reservoir Agent — Multi-Agent Architecture (GCP / ADK Edition)</title>
<desc>Multi-agent system showing OrchestratorAgent routing to SimulationQCAgent, ProductionAnalystAgent, and ReportingAgent via A2A protocol, deployed on Google Cloud Run with Gemini 2.0 Flash as the reasoning engine.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ── GCP Cloud Run boundary ─────────────────────────────────────── -->
<rect x="30" y="20" width="480" height="540" rx="16"
      fill="none" stroke="#4285F4" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
<text x="46" y="42" font-family="sans-serif" font-size="11" fill="#4285F4" opacity="0.8">Google Cloud Run</text>

<!-- ── Enterprise boundary (A2A consumer) ────────────────────────── -->
<rect x="540" y="260" width="128" height="110" rx="12"
      fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3" opacity="0.5"/>
<text x="556" y="278" font-family="sans-serif" font-size="10" fill="#0F6E56" opacity="0.8">Enterprise client</text>

<!-- ── User input box ─────────────────────────────────────────────── -->
<g>
  <rect x="180" y="38" width="180" height="44" rx="8"
        fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="270" y="56" text-anchor="middle" font-family="sans-serif"
        font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">Reservoir engineer</text>
  <text x="270" y="72" text-anchor="middle" font-family="sans-serif"
        font-size="11" fill="#185FA5" dominant-baseline="central">Streamlit UI</text>
</g>

<!-- ── Orchestrator ───────────────────────────────────────────────── -->
<g>
  <rect x="130" y="140" width="280" height="60" rx="10"
        fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="270" y="162" text-anchor="middle" font-family="sans-serif"
        font-size="13" font-weight="500" fill="#26215C" dominant-baseline="central">OrchestratorAgent</text>
  <text x="270" y="182" text-anchor="middle" font-family="sans-serif"
        font-size="11" fill="#3C3489" dominant-baseline="central">Gemini 2.0 Flash · ADK root agent</text>
</g>

<!-- User → Orchestrator -->
<line x1="270" y1="82" x2="270" y2="138"
      stroke="#378ADD" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ── SimulationQCAgent ──────────────────────────────────────────── -->
<g>
  <rect x="48" y="280" width="172" height="56" rx="8"
        fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="134" y="300" text-anchor="middle" font-family="sans-serif"
        font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">SimulationQCAgent</text>
  <text x="134" y="318" text-anchor="middle" font-family="sans-serif"
        font-size="10" fill="#185FA5" dominant-baseline="central">ECLIPSE / OPM QC</text>
</g>

<!-- ── ProductionAnalystAgent ────────────────────────────────────── -->
<g>
  <rect x="234" y="280" width="172" height="56" rx="8"
        fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="320" y="300" text-anchor="middle" font-family="sans-serif"
        font-size="12" font-weight="500" fill="#173404" dominant-baseline="central">ProductionAnalyst</text>
  <text x="320" y="318" text-anchor="middle" font-family="sans-serif"
        font-size="10" fill="#27500A" dominant-baseline="central">DCA · EUR · RelPerm</text>
</g>

<!-- ── ReportingAgent (A2A exposed) ─────────────────────────────── -->
<g>
  <rect x="130" y="400" width="280" height="60" rx="10"
        fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="270" y="422" text-anchor="middle" font-family="sans-serif"
        font-size="13" font-weight="500" fill="#412402" dominant-baseline="central">ReportingAgent</text>
  <text x="270" y="442" text-anchor="middle" font-family="sans-serif"
        font-size="11" fill="#633806" dominant-baseline="central">A2A server · uvicorn :8001</text>
</g>

<!-- Orchestrator → SimulationQC -->
<path d="M200 200 L134 278" fill="none" stroke="#534AB7"
      stroke-width="1" marker-end="url(#arrow)"/>

<!-- Orchestrator → ProductionAnalyst -->
<path d="M340 200 L320 278" fill="none" stroke="#534AB7"
      stroke-width="1" marker-end="url(#arrow)"/>

<!-- Orchestrator → ReportingAgent -->
<line x1="270" y1="200" x2="270" y2="398"
      stroke="#BA7517" stroke-width="1.2" stroke-dasharray="5 3"
      marker-end="url(#arrow)"/>
<text x="278" y="308" font-family="sans-serif" font-size="10" fill="#854F0B">A2A</text>

<!-- ── Tools layer ────────────────────────────────────────────────── -->
<rect x="48" y="490" width="168" height="52" rx="6"
      fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="132" y="510" text-anchor="middle" font-family="sans-serif"
      font-size="11" font-weight="500" fill="#501313" dominant-baseline="central">Physics tools</text>
<text x="132" y="528" text-anchor="middle" font-family="sans-serif"
      font-size="10" fill="#791F1F" dominant-baseline="central">qc_eclipse · fit_dca · swof</text>

<rect x="234" y="490" width="168" height="52" rx="6"
      fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="318" y="510" text-anchor="middle" font-family="sans-serif"
      font-size="11" font-weight="500" fill="#501313" dominant-baseline="central">Report tools</text>
<text x="318" y="528" text-anchor="middle" font-family="sans-serif"
      font-size="10" fill="#791F1F" dominant-baseline="central">format_engineering_context</text>

<!-- Agents → tools -->
<line x1="134" y1="336" x2="132" y2="488"
      stroke="#A32D2D" stroke-width="0.8" opacity="0.6" marker-end="url(#arrow)"/>
<line x1="320" y1="336" x2="318" y2="488"
      stroke="#A32D2D" stroke-width="0.8" opacity="0.6" marker-end="url(#arrow)"/>
<line x1="270" y1="460" x2="318" y2="488"
      stroke="#A32D2D" stroke-width="0.8" opacity="0.6" marker-end="url(#arrow)"/>

<!-- ── Gemini badge ───────────────────────────────────────────────── -->
<rect x="420" y="140" width="76" height="60" rx="8"
      fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="458" y="163" text-anchor="middle" font-family="sans-serif"
      font-size="11" font-weight="500" fill="#04342C" dominant-baseline="central">Gemini</text>
<text x="458" y="179" text-anchor="middle" font-family="sans-serif"
      font-size="10" fill="#085041" dominant-baseline="central">2.0 Flash</text>
<text x="458" y="193" text-anchor="middle" font-family="sans-serif"
      font-size="9" fill="#0F6E56" dominant-baseline="central">exclusive</text>
<line x1="410" y1="170" x2="412" y2="170"
      stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="3 2"/>

<!-- ── Secret Manager badge ──────────────────────────────────────── -->
<rect x="420" y="280" width="76" height="44" rx="8"
      fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="458" y="298" text-anchor="middle" font-family="sans-serif"
      font-size="10" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Secret</text>
<text x="458" y="314" text-anchor="middle" font-family="sans-serif"
      font-size="10" fill="#444441" dominant-baseline="central">Manager</text>

<!-- ── A2A enterprise connection ─────────────────────────────────── -->
<rect x="552" y="288" width="104" height="44" rx="8"
      fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="604" y="306" text-anchor="middle" font-family="sans-serif"
      font-size="10" font-weight="500" fill="#173404" dominant-baseline="central">ERP / HSE</text>
<text x="604" y="322" text-anchor="middle" font-family="sans-serif"
      font-size="10" fill="#27500A" dominant-baseline="central">dashboard</text>

<path d="M412 430 L550 322" fill="none" stroke="#3B6D11"
      stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="490" y="386" font-family="sans-serif" font-size="10"
      fill="#3B6D11" transform="rotate(-35,490,386)">A2A protocol</text>

<!-- ── Agent Identity note ───────────────────────────────────────── -->
<rect x="420" y="350" width="76" height="44" rx="8"
      fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="458" y="368" text-anchor="middle" font-family="sans-serif"
      font-size="10" font-weight="500" fill="#26215C" dominant-baseline="central">Agent</text>
<text x="458" y="384" text-anchor="middle" font-family="sans-serif"
      font-size="10" fill="#3C3489" dominant-baseline="central">Identity</text>

</svg>
