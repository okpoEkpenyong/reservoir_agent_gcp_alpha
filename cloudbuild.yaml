# ── cloudbuild.yaml — Exzing Reservoir Agent CI/CD ───────────────────────────
# Triggered on push to main branch via Cloud Build trigger.
# Pipeline: build image → push to Artifact Registry → deploy to Cloud Run

substitutions:
  _REGION: us-central1
  _SERVICE: exzing-reservoir-agent
  _REPO: reservoir-agent-gcp-alpha
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

steps:
  # ── 1. Build container image ──────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag=${_IMAGE}:${SHORT_SHA}
      - --tag=${_IMAGE}:latest
      - --cache-from=${_IMAGE}:latest
      - .

  # ── 2. Push to Artifact Registry ─────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_IMAGE}
    waitFor: [build]

  # ── 3. Deploy to Cloud Run ────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated          # Public SaaS — auth handled in app
      - --memory=2Gi
      - --cpu=2
      - --min-instances=0               # Scale to zero when idle (cost control)
      - --max-instances=10
      - --port=8001
      - --timeout=300
      # Secrets injected from Secret Manager at runtime
      - --set-secrets=GOOGLE_API_KEY=exzing-gemini-key:latest
      - --set-secrets=GROQ_API_KEY=exzing-groq-key:latest
      - --set-secrets=AZURE_OPENAI_KEY=exzing-azure-key:latest
      - --set-secrets=OPENROUTER_OPENAI_KEY=exzing-openrouter-key:latest
      - --set-secrets=AZURE_OPENAI_API_KEY=exzing-litellm-azure-key:latest
      - --set-secrets=CONTENT_SAFETY_KEY=exzing-content-safety-key:latest
      - --set-env-vars=GOOGLE_PROJECT_ID=${PROJECT_ID}
      - --set-env-vars=GOOGLE_LOCATION=${_REGION}
      - --set-env-vars=GEMINI_MODEL=gemini-2.5-flash
      
    waitFor: [push]

# ── Image artifacts ───────────────────────────────────────────────────────────
images:
  - ${_IMAGE}:${SHORT_SHA}
  - ${_IMAGE}:latest

# ── Options ───────────────────────────────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitutionOption: ALLOW_LOOSE

timeout: 1200s
