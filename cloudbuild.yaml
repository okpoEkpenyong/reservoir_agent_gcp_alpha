# ── cloudbuild.yaml — Final Submission Build (Agent Identity & A2A) ───────────
substitutions:
  _REGION: us-central1
  _REPO: reservoir-agent-gcp-alpha
  # 1. Main Orchestrator
  _SERVICE: exzing-reservoir-agent
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}
  # 2. Reporting Agent
  _REPORTING_SERVICE: exzing-reporting-agent
  _REPORTING_IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_REPORTING_SERVICE}
  # 3. Corporate Agent
  _CORP_SERVICE: exzing-corporate-agent
  _CORP_IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_CORP_SERVICE}

steps:
  # ── 1. Build All Three Images ──────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-orchestrator
    args: ['build', '--tag=${_IMAGE}:${SHORT_SHA}', '--tag=${_IMAGE}:latest', '--cache-from=${_IMAGE}:latest', '.']

  - name: gcr.io/cloud-builders/docker
    id: build-reporting
    args: ['build', '--tag=${_REPORTING_IMAGE}:${SHORT_SHA}', '--tag=${_REPORTING_IMAGE}:latest', '-f', 'Dockerfile.reporting', '.']

  - name: gcr.io/cloud-builders/docker
    id: build-corporate
    args: ['build', '--tag=${_CORP_IMAGE}:${SHORT_SHA}', '--tag=${_CORP_IMAGE}:latest', '-f', 'Dockerfile.corporate', '.']

  # ── 2. Push Individual Images ────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-orchestrator
    args: ['push', '--all-tags', '${_IMAGE}']
    waitFor: ['build-orchestrator']

  - name: gcr.io/cloud-builders/docker
    id: push-reporting
    args: ['push', '--all-tags', '${_REPORTING_IMAGE}']
    waitFor: ['build-reporting']

  - name: gcr.io/cloud-builders/docker
    id: push-corporate
    args: ['push', '--all-tags', '${_CORP_IMAGE}']
    waitFor: ['build-corporate']

  # ── 3. Deploy Reporting Sub-Agent (ADK + Identity) ───────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-reporting
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install "google-cloud-aiplatform[adk,agent_engines]" --break-system-packages
        python3 -m google.adk.cli.main deploy cloud_run \
          --service-name=${_REPORTING_SERVICE} \
          --region=${_REGION} \
          --image=${_REPORTING_IMAGE}:${SHORT_SHA} \
          --port=8007 \
          --allow-unauthenticated \
          --set-env-vars=GOOGLE_PROJECT_ID=${PROJECT_ID},GOOGLE_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,GEMINI_MODEL=gemini-2.5-flash
    waitFor: ['push-reporting']

  # ── 4. Deploy Corporate Sub-Agent (ADK + Identity) ────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-corporate
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install "google-cloud-aiplatform[adk,agent_engines]" --break-system-packages
        python3 -m google.adk.cli.main deploy cloud_run \
          --service-name=${_CORP_SERVICE} \
          --region=${_REGION} \
          --image=${_CORP_IMAGE}:${SHORT_SHA} \
          --port=8008 \
          --allow-unauthenticated \
          --set-env-vars=GOOGLE_PROJECT_ID=${PROJECT_ID},GOOGLE_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,GEMINI_MODEL=gemini-2.5-flash
    waitFor: ['push-corporate']

  # ── 5. Deploy Main Orchestrator (Linked to Sub-Agents) ────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-orchestrator
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install "google-cloud-aiplatform[adk,agent_engines]" --break-system-packages
        python3 -m google.adk.cli.main deploy cloud_run \
          --service-name=${_SERVICE} \
          --region=${_REGION} \
          --image=${_IMAGE}:${SHORT_SHA} \
          --port=8001 \
          --allow-unauthenticated \
          --set-env-vars=REPORTING_URL=https://reporting.exzing.com/a2a,FACILITY_URL=https://corporate.exzing.com/a2a,GOOGLE_PROJECT_ID=${PROJECT_ID},GOOGLE_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,GEMINI_MODEL=gemini-2.5-flash,AZURE_API_VERSION=2025-01-01-preview,AZURE_API_BASE=https://eastus.api.cognitive.microsoft.com/openai/deployments/gpt-5-main/chat/completions?api-version=2025-01-01-preview,AZURE_OPENAI_ENDPOINT=https://eastus.api.cognitive.microsoft.com/openai/deployments/gpt-5-main/chat/completions?api-version=2025-01-01-preview \
          --set-secrets=GOOGLE_API_KEY=exzing-gemini-key:latest,GROQ_API_KEY=exzing-groq-key:latest,AZURE_OPENAI_KEY=exzing-azure-key:latest,OPENROUTER_OPENAI_KEY=exzing-openrouter-key:latest,AZURE_OPENAI_API_KEY=exzing-litellm-azure-key:latest,CONTENT_SAFETY_KEY=exzing-content-safety-key:latest
    waitFor: ['push-orchestrator', 'deploy-reporting', 'deploy-corporate']

# ── Metadata ──────────────────────────────────────────────────────────────────
images:
  - ${_IMAGE}:latest
  - ${_REPORTING_IMAGE}:latest
  - ${_CORP_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitutionOption: ALLOW_LOOSE

timeout: 1800s
