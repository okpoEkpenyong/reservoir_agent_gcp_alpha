# ── cloudbuild.yaml — Exzing Orchestrator CI/CD (Reporting/Corporate temporarily disabled) ──
substitutions:
  _REGION: us-central1
  _REPO: reservoir-agent-gcp-alpha
  # 1. Orchestrator
  _SERVICE: exzing-reservoir-agent
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}
  # 2. Reporting Agent (disabled — see agent.py, temporarily commented out)
  # _REPORTING_SERVICE: exzing-reporting-agent
  # _REPORTING_IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_REPORTING_SERVICE}
  # 3. Corporate Agent (disabled)
  # _CORP_SERVICE: exzing-corporate-agent
  # _CORP_IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_CORP_SERVICE}

steps:
  # ── 1. Build Orchestrator Image ──────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-orchestrator
    args: ['build', '--tag=${_IMAGE}:${SHORT_SHA}', '--tag=${_IMAGE}:latest', '--cache-from=${_IMAGE}:latest', '.']

  # - name: gcr.io/cloud-builders/docker
  #   id: build-reporting
  #   args: ['build', '--tag=${_REPORTING_IMAGE}:${SHORT_SHA}', '--tag=${_REPORTING_IMAGE}:latest', '-f', 'Dockerfile.reporting', '.']

  # - name: gcr.io/cloud-builders/docker
  #   id: build-corporate
  #   args: ['build', '--tag=${_CORP_IMAGE}:${SHORT_SHA}', '--tag=${_CORP_IMAGE}:latest', '-f', 'Dockerfile.corporate', '.']

  # ── 2. Push Orchestrator Image ───────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-images
    args: ['push', '--all-tags', '${_IMAGE}']
    waitFor: ['build-orchestrator']

  # - name: gcr.io/cloud-builders/docker
  #   id: push-reporting
  #   args: ['push', '--all-tags', '${_REPORTING_IMAGE}']
  #   waitFor: ['build-reporting']

  # - name: gcr.io/cloud-builders/docker
  #   id: push-corporate
  #   args: ['push', '--all-tags', '${_CORP_IMAGE}']
  #   waitFor: ['build-corporate']

  # ── 3. Deploy Reporting Agent (disabled) ─────────────────────────────────
  # - name: gcr.io/google.com/cloudsdktool/cloud-sdk
  #   id: deploy-reporting
  #   ...

  # ── 4. Deploy Corporate Facility Agent (disabled) ────────────────────────
  # - name: gcr.io/google.com/cloudsdktool/cloud-sdk
  #   id: deploy-corporate
  #   ...

  # ── 5. Deploy Orchestrator ────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-orchestrator
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --port=8001
      - --service-account=45991959818-compute@developer.gserviceaccount.com
      - --set-env-vars=GOOGLE_PROJECT_ID=${PROJECT_ID},GOOGLE_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,GEMINI_MODEL=gemini-2.5-flash,AZURE_API_VERSION=2025-01-01-preview,AZURE_API_BASE=https://eastus.api.cognitive.microsoft.com/openai/deployments/gpt-5-main/chat/completions?api-version=2025-01-01-preview,AZURE_OPENAI_ENDPOINT=https://eastus.api.cognitive.microsoft.com/openai/deployments/gpt-5-main/chat/completions?api-version=2025-01-01-preview
      - --set-secrets=GOOGLE_API_KEY=exzing-gemini-key:latest
      - --set-secrets=GROQ_API_KEY=exzing-groq-key:latest
      - --set-secrets=AZURE_OPENAI_KEY=exzing-azure-key:latest
      - --set-secrets=OPENROUTER_OPENAI_KEY=exzing-openrouter-key:latest
      - --set-secrets=AZURE_OPENAI_API_KEY=exzing-litellm-azure-key:latest
      - --set-secrets=CONTENT_SAFETY_KEY=exzing-content-safety-key:latest
    waitFor: ['push-images']

images:
  - ${_IMAGE}:${SHORT_SHA}
  - ${_IMAGE}:latest
  # - ${_REPORTING_IMAGE}:${SHORT_SHA}
  # - ${_REPORTING_IMAGE}:latest
  # - ${_CORP_IMAGE}:${SHORT_SHA}
  # - ${_CORP_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitutionOption: ALLOW_LOOSE

timeout: 1200s